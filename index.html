<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Ticket Booking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Train Ticket Booking System</h1>
                <p class="text-indigo-200 text-sm">FastAPI + PostgreSQL Production-Grade Demo Dashboard</p>
            </div>
            <span id="apiStatus" class="bg-indigo-600 px-3 py-1 rounded-full text-xs font-semibold">Checking
                API...</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-6 pb-12">

        <!-- 1. Search Trains -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-semibold text-indigo-900 mb-4">Search Trains</h3>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Source</label>
                <input type="text" id="source" placeholder="e.g. Kanpur"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                <input type="text" id="destination" placeholder="e.g. Delhi"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="searchTrains()"
                class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">Search
                Trains</button>
            <div id="searchResult" class="mt-4 text-sm"></div>
        </div>

        <!-- 2. Book a Seat -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-semibold text-indigo-900 mb-4">Book a Seat</h3>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Train ID</label>
                <input type="number" id="bookTrainId" placeholder="e.g. 1"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Seat ID</label>
                <input type="number" id="bookSeatId" placeholder="e.g. 1"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button onclick="bookSeat()"
                class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg hover:bg-emerald-700 transition">Confirm
                Booking</button>
            <div id="bookResult" class="mt-4 text-sm"></div>
        </div>

        <!-- 3. Check PNR Status -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-semibold text-indigo-900 mb-4">Check PNR Status</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">PNR Number</label>
                <input type="text" id="pnrNumber" placeholder="e.g. PNR-ABC12345"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <button onclick="checkPnr()"
                class="w-full bg-amber-600 text-white font-medium py-2 rounded-lg hover:bg-amber-700 transition">Fetch
                PNR Details</button>
            <div id="pnrResult" class="mt-4 text-sm"></div>
        </div>

        <!-- 4. Cancel Booking (PNR Based) -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-semibold text-indigo-900 mb-4">Cancel Booking</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">PNR Number</label>
                <input type="text" id="cancelPnr" placeholder="e.g. PNR-ABC12345"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <button onclick="cancelBooking()"
                class="w-full bg-rose-600 text-white font-medium py-2 rounded-lg hover:bg-rose-700 transition">Cancel
                Ticket</button>
            <div id="cancelResult" class="mt-4 text-sm"></div>
        </div>

    </main>

    <script>
        const API_URL = 'http://127.0.0.1:8000';

        // Check backend connection on load
        window.onload = async () => {
            const statusBadge = document.getElementById('apiStatus');
            try {
                const res = await fetch(`${API_URL}/`);
                if (res.ok) {
                    statusBadge.innerText = "API: Connected";
                    statusBadge.className = "bg-emerald-600 px-3 py-1 rounded-full text-xs font-semibold";
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusBadge.innerText = "API: Connection Failed";
                statusBadge.className = "bg-rose-600 px-3 py-1 rounded-full text-xs font-semibold";
            }
        };

        // 1. Search Trains
        async function searchTrains() {
            const source = document.getElementById('source').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const resultDiv = document.getElementById('searchResult');

            if (!source || !destination) {
                resultDiv.innerHTML = '<span class="text-red-600">Please fill both source and destination.</span>';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/trains/search?source=${source}&destination=${destination}`);
                const data = await res.json();
                if (res.ok && data.length > 0) {
                    let html = '<ul class="space-y-2 mt-2">';
                    data.forEach(train => {
                        html += `<li class="p-2 bg-indigo-50 rounded border border-indigo-100">
                            <strong>ID: ${train.id}</strong> | ${train.train_name} (${train.train_number})<br>
                            <span class="text-xs text-gray-600">Route: ${train.source} → ${train.destination} | Seats: ${train.total_seats}</span>
                        </li>`;
                    });
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<span class="text-amber-600">No trains found for this route.</span>';
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="text-red-600">Failed to connect to server.</span>';
            }
        }

        // 2. Book a Seat
        async function bookSeat() {
            const trainId = document.getElementById('bookTrainId').value;
            const seatId = document.getElementById('bookSeatId').value;
            const resultDiv = document.getElementById('bookResult');

            if (!trainId || !seatId) {
                resultDiv.innerHTML = '<span class="text-red-600">Please enter both Train ID and Seat ID.</span>';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/bookings/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 1, // Default auto-seeded test user
                        train_id: parseInt(trainId),
                        seat_id: parseInt(seatId)
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    resultDiv.innerHTML = `<span class="text-emerald-600 font-semibold">Success! PNR: ${data.pnr_number} | Booking ID: ${data.id} | Status: ${data.booking_status}</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="text-red-600">Error: ${data.detail || 'Booking failed'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="text-red-600">Connection failed.</span>';
            }
        }

        // 3. Check PNR Status
        async function checkPnr() {
            const pnr = document.getElementById('pnrNumber').value.trim();
            const resultDiv = document.getElementById('pnrResult');

            if (!pnr) {
                resultDiv.innerHTML = '<span class="text-red-600">Please enter a PNR number.</span>';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/bookings/pnr/${pnr}`);
                const data = await res.json();
                if (res.ok) {
                    resultDiv.innerHTML = `<div class="p-2 bg-amber-50 rounded border border-amber-200">
                        <strong>PNR:</strong> ${data.pnr_number}<br>
                        <strong>Status:</strong> <span class="text-emerald-700 font-bold">${data.booking_status}</span><br>
                        <span class="text-xs text-gray-600">Train ID: ${data.train_id} | Seat ID: ${data.seat_id}</span>
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<span class="text-red-600">Error: ${data.detail || 'PNR not found'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="text-red-600">Connection failed.</span>';
            }
        }

        // 4. Cancel Booking by PNR
        async function cancelBooking() {
            const pnr = document.getElementById('cancelPnr').value.trim();
            const resultDiv = document.getElementById('cancelResult');

            if (!pnr) {
                resultDiv.innerHTML = '<span class="text-red-600">Please enter a PNR number.</span>';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/bookings/pnr/${pnr}/cancel`, {
                    method: 'PUT'
                });
                const data = await res.json();
                if (res.ok) {
                    resultDiv.innerHTML = `<span class="text-emerald-600 font-semibold">Cancelled Successfully! PNR: ${data.pnr_number} | Status: ${data.status}</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="text-red-600">Error: ${data.detail || 'Could not cancel'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="text-red-600">Connection failed.</span>';
            }
        }
    </script>
</body>

</html>
